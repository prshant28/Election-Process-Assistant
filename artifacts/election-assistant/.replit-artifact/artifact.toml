kind = "web"
previewPath = "/"
title = "Election Process Assistant"
version = "1.0.0"
id = "artifacts/election-assistant"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21137

[services.development]
run = "pnpm --filter @workspace/election-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/election-assistant", "run", "build" ]
publicDir = "artifacts/election-assistant/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21137"
BASE_PATH = "/"
